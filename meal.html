<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聚餐管理 | Office Hub</title><link rel="stylesheet" href="css/meal.css"></head><body><main class="meal-shell"><nav class="meal-nav"><strong>◈ OFFICE HUB / V4.0</strong><a href="index.html">🧋 返回飲料訂購</a></nav><header class="meal-hero"><h1>🍽️ 聚餐活動管理</h1><p>活動登記 · 眷屬分類 · 多人額度抵扣 · 即時統計</p></header><section class="meal-card"><div class="meal-grid"><label class="meal-field">管理者密碼<input type="password" id="pw" autocomplete="current-password" placeholder="與飲料系統相同的管理密碼"></label><label class="meal-field">活動<select id="event"></select></label></div><div class="meal-actions"><button class="meal-btn" id="load">載入活動資料</button><button class="meal-btn secondary" id="export">匯出本活動 CSV</button></div><p class="meal-muted" id="status">需先在 Supabase 執行 supabase/meal_v4.sql。</p></section><section class="meal-card"><h2>建立聚餐活動</h2><form id="create"><div class="meal-grid"><label class="meal-field">活動名稱<input id="title" required maxlength="100" placeholder="例如 2026 年尾牙"></label><label class="meal-field">每位員工額度（元）<input id="quota" type="number" min="0" value="1000" required></label><label class="meal-field">成人餐費（元）<input id="adult" type="number" min="0" value="1000" required></label><label class="meal-field">兒童餐費（元）<input id="child" type="number" min="0" value="500" required></label><label class="meal-field">身高門檻（cm，達門檻算成人）<input id="height" type="number" min="1" max="250" value="140" required></label></div><div class="meal-actions"><button class="meal-btn">新增活動</button><button type="button" class="meal-btn secondary" id="toggle">關閉／重新開放活動</button></div></form></section><section class="meal-card"><h2>登記人員及眷屬</h2><p class="meal-muted">員工本人預設 1 人；眷屬依活動身高門檻分成人與兒童。額度提供者可不參加活動。</p><form id="registration"><div class="meal-grid"><label class="meal-field">單位<select id="unit" required></select></label><label class="meal-field">登記員工<select id="member" required></select></label><label class="meal-field">眷屬達身高門檻人數<input id="fa" type="number" min="0" value="0" required></label><label class="meal-field">眷屬未達門檻人數<input id="fc" type="number" min="0" value="0" required></label><label class="meal-field">備註<input id="note" maxlength="500" placeholder="特殊需求"></label></div><h3>額度分配</h3><div id="lenders"></div><button type="button" class="meal-btn secondary" id="add-lender">＋ 新增額度來源</button><div class="meal-note" id="preview" style="margin-top:15px">請選擇活動並填寫人數。</div><div class="meal-actions"><button class="meal-btn" id="save">儲存登記與額度分配</button><button type="button" class="meal-btn secondary" id="reset">清除編輯</button></div></form></section><section class="meal-card"><h2>活動統計</h2><div class="meal-kpis" id="kpis"></div><div class="meal-table-wrap"><table class="meal-table"><thead><tr><th>登記人</th><th>員工/眷屬</th><th>原費用</th><th>額度抵扣</th><th>實付</th><th>操作</th></tr></thead><tbody id="records"></tbody></table></div></section><section class="meal-card"><h2>額度使用明細</h2><div class="meal-table-wrap"><table class="meal-table"><thead><tr><th>額度提供者</th><th>受益登記人</th><th>使用額度</th><th>剩餘額度</th></tr></thead><tbody id="alloc-records"></tbody></table></div><p class="meal-muted">本模組為管理者操作版。使用他人額度前，應先取得額度提供者同意。</p></section></main><script type="module" src="js/meal.js"></script></body></html>
